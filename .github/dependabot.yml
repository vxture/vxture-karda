version: 2

# Root .npmrc points the @vxture scope at GitHub Packages, so Dependabot needs
# its own credential to resolve the dependency graph at all. Dependabot secrets
# are a separate store from Actions secrets - the org NODE_AUTH_TOKEN exists in
# both, but a registry declared here is what makes Dependabot actually use it.
# Without this block every npm update run fails wholesale with
# private_source_authentication_failure (not just on @vxture/* - the whole
# resolution aborts, so react/prisma/jose updates die too).
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NODE_AUTH_TOKEN}}

updates:
  # pnpm workspace root (repo root - pnpm-lock.yaml lives here, covering
  # portals/app and portals/packages/shared). Dependabot's "npm" ecosystem
  # reads pnpm-lock.yaml too.
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # @vxture/* is org-internal and needs a deliberate look, not batched.
      vxture-packages:
        patterns:
          - '@vxture/*'
    ignore:
      # @vxture/* moves on its own release cadence from a different repo -
      # bump it deliberately, not via an automated PR.
      - dependency-name: '@vxture/*'

  # Keep pinned Action versions current - these live outside npm and would
  # otherwise drift silently.
  #
  # GROUPED into ONE pull request, deliberately (2026-08-28). Ungrouped, four
  # bumps arrived as four PRs on 2026-08-12 and all four sat for over two weeks:
  # each was green, each went BEHIND as main moved on, and none was individually
  # worth a round trip. **A queue of stale-but-green PRs is worse than none** -
  # it teaches the reader that a green check does not mean ready to merge.
  #
  # One PR per week is a review unit somebody will actually pick up, and the
  # four bumps genuinely belong together: they are all "keep the CI toolchain
  # current", with no independent decision in any of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
