name: ci

# Trunk-based CI: runs on PRs to main and on push:main (the squash commit that
# lands on main is a new SHA, so it gets its own gate run). Does NOT deploy.
#
# Produces four of the five required status checks named in
# docs/50-deployment/rebuild/main-ruleset.json: `quality-gate` / `build` /
# `test-coverage` / `audit` (the fifth, `gitleaks`, is in secret-scan.yml). Job
# names are a stable contract - renaming one breaks branch protection. In the
# governance-shell batch `build` and `test-coverage` are green placeholders (no
# app, no tests yet); later batches replace them with real work while keeping
# the context names stable.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- Audit (SCA hard gate) --------------------------------------------------
  # Real SCA: osv-scanner scans pnpm-lock.yaml's full dependency tree against
  # the OSV vulnerability database and hard-blocks on any new finding. Runs the
  # pinned, sha256-verified binary directly (no third-party action: no license
  # or supply-chain concern), mirroring the gitleaks pattern in secret-scan.yml.
  # The baseline is empty (.osv-scanner.toml); new advisories must be fixed, not
  # suppressed. `audit` is a required check on main.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Single point of upgrade (see https://github.com/google/osv-scanner/releases).
      # Bump both the version and the sha256 below together.
      OSV_SCANNER_VERSION: "2.4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache osv-scanner binary
        id: osv-cache
        uses: actions/cache@v6
        with:
          path: /tmp/osv-bin
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-linux-amd64

      - name: Download osv-scanner (cache miss only)
        if: ${{ steps.osv-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          mkdir -p /tmp/osv-bin
          curl -fsSL "$url" -o /tmp/osv-bin/osv-scanner
          echo "${sha256}  /tmp/osv-bin/osv-scanner" | sha256sum -c -

      - name: OSV dependency scan
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/osv-bin/osv-scanner
          # Must pass --config explicitly: when scanning a --lockfile,
          # osv-scanner does not auto-discover the repo-root config, so the
          # ignore baseline would silently not apply. A new advisory exits
          # non-zero and fails this required check.
          # --allow-no-lockfiles: the governance-shell batch has zero runtime
          # dependencies, so the lockfile lists 0 packages; without this flag
          # osv-scanner exits 128 ("no package sources"). Once batch 2 adds real
          # dependencies the flag is a no-op and this becomes a real scan.
          /tmp/osv-bin/osv-scanner scan -L pnpm-lock.yaml --config .osv-scanner.toml --allow-no-lockfiles

  # -- Did any CODE change? ---------------------------------------------------
  # The required checks must ALWAYS report - a docs-only PR that never produces
  # `build` / `test-coverage` is blocked forever, which is why this repo can
  # never use paths-ignore on ci.yml. So the jobs still run and still report;
  # what they skip is the expensive middle (install, type-check, build, tests)
  # when the diff cannot possibly affect them.
  #
  # Fails OPEN on purpose: anything unexpected (a shallow clone, a force-push, a
  # base branch that cannot be resolved) reports `code=true` and runs the full
  # gate. The failure mode of guessing wrong must be "did unnecessary work", not
  # "skipped the check that would have caught it".
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push to main - always the full gate"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          if ! files=$(git diff --name-only "$base...HEAD" 2>/dev/null) || [ -z "$files" ]; then
            echo "cannot resolve the diff - failing open to the full gate"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          # Anything outside docs/ and *.md counts as code. DDL is deliberately
          # code here (ci.yml runs the DDL<->Prisma lockstep guardrail), even
          # though codeql treats it as non-source.
          if echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change - build and tests have nothing to verify"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # -- Static checks (feed quality-gate) --------------------------------------
  # Pure-node, zero-dependency checks that run without a pnpm install: the docs
  # numbering hard gate and a whitespace/marker check. quality-gate aggregates
  # this; later batches add type-check / lint / guardrails as they become real.
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Whitespace and conflict-marker check
        run: git diff --check

      - name: Docs numbering guardrail (strict)
        run: node scripts/guardrails/check-docs-numbering.mjs --strict

      - name: Data architecture guardrail (DDL <-> Prisma lockstep)
        run: node scripts/guardrails/check-data-architecture.mjs --strict

      - name: Workflow guardrail (workflows parse and keep their triggers)
        run: node scripts/guardrails/check-workflows.mjs --strict

      - name: Port-consistency guardrail (registry R3, one story per repo)
        run: node scripts/guardrails/check-port-consistency.mjs

      - name: i18n seam guardrail (no product strings outside the catalog)
        run: node scripts/guardrails/check-i18n-seam.mjs

      - name: Interface register guardrail (260 section 3 <-> tool catalog)
        run: node scripts/guardrails/check-interface-register.mjs --strict

      - name: Atlas contract guardrail (published codes only; product axis only)
        run: node scripts/guardrails/check-atlas-contract.mjs --strict

      - name: Tech-debt register guardrail (every entry states its status)
        run: node scripts/guardrails/check-tech-debt.mjs --strict

  # -- Quality gate (aggregator; stable required-check name) ------------------
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - name: Aggregate
        run: |
          echo "quality gate: all aggregated checks passed"

  # -- Build (required check): install the pnpm workspace, type-check the
  # shared package, and produce the Next.js standalone build for the app.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 15
    # The job always runs so the required context always reports; every step
    # below is conditional on there being code to build.
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Nothing to build (docs-only change)
        if: env.CODE != 'true'
        run: echo "docs-only change - no source to type-check or build"

      - name: Checkout
        if: env.CODE == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: env.CODE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        if: env.CODE == 'true'
        run: corepack enable

      # pnpm 11 no longer expands ${NODE_AUTH_TOKEN} in the project .npmrc, so
      # the credential goes into ~/.npmrc explicitly before the install.
      - name: Wire GitHub Packages auth
        if: env.CODE == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install (frozen lockfile)
        if: env.CODE == 'true'
        run: pnpm install --frozen-lockfile
        env:
          # @vxture/shared resolves from GitHub Packages (org secret, visibility
          # "all" - every org repo's Actions can read it).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Type-check (shared)
        if: env.CODE == 'true'
        run: pnpm type-check:all

      - name: Build app (Next.js standalone)
        if: env.CODE == 'true'
        run: pnpm build
        env:
          # Provenance is read at runtime (server env), not baked by `next build`;
          # set GIT_SHA so the CI build environment is representative.
          GIT_SHA: ${{ github.sha }}

  # -- Test coverage (required check): run the app unit tests (node:test + tsx).
  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Nothing to test (docs-only change)
        if: env.CODE != 'true'
        run: echo "docs-only change - no source under test"

      - name: Checkout
        if: env.CODE == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: env.CODE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        if: env.CODE == 'true'
        run: corepack enable

      # pnpm 11 no longer expands ${NODE_AUTH_TOKEN} in the project .npmrc, so
      # the credential goes into ~/.npmrc explicitly before the install.
      - name: Wire GitHub Packages auth
        if: env.CODE == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install (frozen lockfile)
        if: env.CODE == 'true'
        run: pnpm install --frozen-lockfile
        env:
          # @vxture/shared resolves from GitHub Packages (org secret, visibility
          # "all" - every org repo's Actions can read it).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Run tests
        if: env.CODE == 'true'
        run: pnpm --filter @karda/app test
