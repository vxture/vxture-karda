name: codeql

# Static application security testing (SAST) for the app's TypeScript/
# JavaScript source. Separate from secret-scan (gitleaks, in ci.yml, which
# looks for committed credentials) and trivy (build.yml, which scans the
# built container image's OS/dependency layers) - this looks for actual
# code-level vulnerability patterns (injection, unsafe deserialization,
# etc.) in the app's own source. Free for public repos, no GHAS license
# needed.

# paths-ignore is safe HERE and nowhere else in this repo: `analyze` is NOT one
# of the five required checks (main-ruleset.json), so a skipped run does not
# leave a required context unreported and does not block a merge. That matters -
# putting paths-ignore on ci.yml or secret-scan.yml would block every docs-only
# PR forever, because a check that never runs never reports.
#
# It is also where the money was. Over the last 60 runs codeql accounted for
# 35 of 68 runner-minutes - more than half - and a large share of that was
# analysing TypeScript for commits that touched only Markdown. The weekly cron
# below still sweeps the whole tree, so nothing goes unscanned indefinitely.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/database/ddl/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/database/ddl/**'
  schedule:
    # Weekly sweep catches new CodeQL query-pack findings against unchanged
    # code (the PR/push triggers only cover code that actually changed).
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
