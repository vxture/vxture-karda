# Local dev stack - builds the app image from the working tree and runs the
# full karda group (app + postgres + redis) on this machine, mirroring the
# runos/atlas/arda local-stack conventions:
#
#   compose project  karda                      (Docker Desktop group)
#   containers       vx-karda-app-dev / vx-karda-postgres-db-dev / vx-karda-redis-db-dev
#   image            ghcr.io/vxture/karda-app:local   (compose build, never pushed)
#
# This file NEVER deploys anywhere: the deploy stacks use docker-compose.yml
# with CI-built images. Service names (app/db/redis) are the stable network
# aliases, so container renames never break a URL.
#
# Usage:
#   NODE_AUTH_TOKEN=$(gh auth token) \
#   GIT_SHA=$(git rev-parse --short=8 HEAD) APP_VERSION=$(git describe --tags --always) \
#   docker compose -f docker-compose.dev.yml up -d --build
#   bash deploy/database/apply-local-dev.sh     # DDL baseline into the dev db
#   curl http://localhost:3240/api/health       # karda allocated port (registry: arda 3230, vxtpl 4000)
# GIT_SHA/APP_VERSION default to "local"/"unknown" (honest, un-injected) if not
# exported - set them so /api/health reports which working-tree commit is
# actually running, same as the prod-parity stack's provenance.
name: ${PROJECT_NAME:-karda}

services:
  app:
    container_name: vx-karda-app-dev
    build:
      context: .
      dockerfile: portals/app/Dockerfile
      # Explicit last-stage pin (#193): never depend on stage order.
      target: runner
      # @vxture/* packages come from GitHub Packages; local builds need
      # NODE_AUTH_TOKEN (gh's token carries read:packages) in the environment.
      # BuildKit secret, same as CI - never a build-arg.
      secrets:
        - node_auth_token
      args:
        APP_VERSION: ${APP_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        DEPLOY_STAGE: dev
    image: ghcr.io/vxture/karda-app:local
    ports:
      # R3 (port registry): host port AND in-container port are both karda's
      # allocated 3240 (arda holds 3230; vxtpl is 4000 since the 2026-08-13
      # layer reassignment), so parallel local stacks never collide and the
      # container speaks the same number the registry allocates.
      - "${APP_PUBLISH_PORT:-3240}:3240"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3240"
      REDIS_URL: redis://redis:6379
      # Connect as the least-privilege service role (prod parity), created by
      # deploy/database/ddl/97_service_role.sql via apply-local-dev.sh.
      DATABASE_URL: postgresql://karda_svc:${KARDA_SVC_PASSWORD:-karda_svc_dev}@db:5432/vx_karda_db
      # Local http: no OIDC (mock resolver, unconfigured C1) and a non-__Host
      # session cookie name (see .env.example).
      OIDC_RP_ENABLED: "off"
      RP_SESSION_COOKIE_NAME: vx_rp_session
      # Triple-gated dev-only virtual login (see app/auth/lib/dev-login.ts):
      # only takes effect because OIDC_RP_ENABLED is off and DEPLOY_STAGE != production.
      AUTH_DEV_LOGIN: "on"
      # Mock entitlement for the front door (entitlement/resolver.ts): the gate
      # adjudicates for real even under dev-login, so give the dev workspace an
      # active tier - otherwise a signed-in visit to /gate reads "not subscribed"
      # while the pages behind it serve normally. Status defaults to "active".
      MOCK_TIER: pro
      # Absolute-redirect origin (auth/lib/config.ts appOrigin). Without this,
      # routes that build a redirect from req.url pick up the standalone
      # server's bind hostname (0.0.0.0 - required for the Docker port publish
      # to work) instead of an address the host browser can reach.
      NEXT_PUBLIC_APP_URL: http://localhost:${APP_PUBLISH_PORT:-3240}
      STATUS_PAGE: public
      STATUS_SHOW_INFRA: "on"
      # Object storage root. WITHOUT THIS the object store falls back to the
      # in-memory implementation, which is constructed PER REQUEST - so uploaded
      # bytes vanish immediately and document download/preview answers
      # `object_missing` for everything. The feature is not broken; the dev
      # stack simply had nowhere to put the bytes.
      KARDA_OBJECT_ROOT: /var/lib/karda/objects
      # Machine credential for the internal job endpoints (processing tick,
      # governance sweep, preset seeding). Without it `POST
      # /api/kb/admin/seed-presets` is 403, `processing_template` stays empty,
      # and the library settings template picker offers nothing to pick.
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:-karda-dev-job-token}
    volumes:
      # Uploaded bytes have to outlive the container, or a restart silently
      # empties every library while the rows still say the documents exist.
      - karda-dev-objects:/var/lib/karda/objects
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3240/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [appnet]
    restart: unless-stopped

  db:
    container_name: vx-karda-postgres-db-dev
    # postgres 18: parent-dir mount + real-query healthcheck (#192).
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vx_karda_db
      # Superuser = DB owner. Karda's owner is `postgres` (matches the prod
      # compose and db-init), unlike arda which names it after the product.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karda}
    volumes:
      - karda-dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-postgres} -d vx_karda_db -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [appnet]
    restart: unless-stopped

  redis:
    container_name: vx-karda-redis-db-dev
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:
    name: ${PROJECT_NAME:-karda}-dev-net

volumes:
  karda-dev-pgdata:
  karda-dev-objects:

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
