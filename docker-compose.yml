# Three-container stack for the app profile: <code>-app (Next.js) + <code>-redis
# (RP session store) + <code>-db (business data). PROJECT_NAME drives the
# compose project + container-name prefix so prod and beta never collide on one
# host (prod=<code>-*, beta=<code>-beta-*). Backing services are internal-only;
# only the app publishes a port. Structure/deploy details are exercised in the
# deployment batch (batch E).
name: ${PROJECT_NAME:-karda}

services:
  app:
    container_name: ${PROJECT_NAME:-karda}-app
    build:
      context: .
      dockerfile: portals/app/Dockerfile
      # Explicit runtime stage: without --target docker builds the LAST stage,
      # so any stage appended after `runner` would silently become the image
      # entrypoint. Pin it here and in build.yml.
      target: runner
      # Local `compose build` only; the deploy path pulls the CI-built image (which
      # injects real provenance). Honest dev/unknown defaults for local builds.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        DEPLOY_STAGE: ${DEPLOY_STAGE:-dev}
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-vxture}/${PRODUCT_CODE:-karda}-app:${IMAGE_TAG:-local}
    # Load the full operator .env into the app so ALL runtime config (OIDC,
    # platform client, webhook, INTERNAL_JOB_TOKEN, STATUS_PAGE, ...) reaches it -
    # not just the few keys in `environment:` below. APP_ENV_FILE is the absolute
    # path deploy.sh passes (<root>/etc/.env); local dev falls back to ./.env.
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://${PROJECT_NAME:-karda}-redis:6379
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${APP_PUBLISH_PORT:-3000}:3000"
    depends_on:
      - redis
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [appnet]
    restart: unless-stopped

  redis:
    container_name: ${PROJECT_NAME:-karda}-redis
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks: [appnet]
    restart: unless-stopped

  db:
    container_name: ${PROJECT_NAME:-karda}-db
    image: postgres:18-alpine
    environment:
      # The container superuser is the DB OWNER, NOT the service role. The DDL
      # (db-init, as this owner) creates the least-privilege <code>_svc role that
      # the app connects as via DATABASE_URL (product_240 section 2.7: connect
      # identity = <code>_svc, never owner-direct).
      # DB name per platform ADR-007: vx_karda_db in EVERY environment - the
      # env lives in the stack/instance, never in the database name.
      POSTGRES_DB: ${POSTGRES_DB:-vx_${PRODUCT_CODE_SNAKE:-karda}_db}
      POSTGRES_USER: ${POSTGRES_DB_OWNER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # Mount the PARENT directory, not .../data: the 18+ image refuses a
      # pre-18 layout at the old mount point and keeps data in a versioned
      # subdirectory instead, which is what makes pg_upgrade --link possible.
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql
    healthcheck:
      # A real query against the target database, NOT pg_isready: during first
      # init the entrypoint runs a temporary server where POSTGRES_DB does not
      # exist yet but pg_isready already reports success.
      test: ["CMD-SHELL", "psql -U ${POSTGRES_DB_OWNER:-postgres} -d ${POSTGRES_DB:-vx_karda_db} -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:
    name: ${PROJECT_NAME:-karda}-net
