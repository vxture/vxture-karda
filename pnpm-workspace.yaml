# pnpm workspace roots. The app profile roots packages under portals/, per the
# governance source-directory slots. Karda's own packages join these globs.
packages:
  - "portals/*"
  - "portals/packages/*"

# Security pin overrides. pnpm 11 no longer reads package.json's pnpm.overrides;
# this block IS the former root-package.json block, moved verbatim - keep the
# pins when editing here.
overrides:
  "postcss@<8.5.10": ">=8.5.10"
  "@hono/node-server@<1.19.13": ">=1.19.13"
  "sharp@<0.35.0": ">=0.35.0"
  "valibot@<1.4.2": ">=1.4.2"
  # GHSA-ggr8-5vv4-36mx (stack exhaustion): @prisma/config pins 7.1.5; only
  # 8.0.0+ is fixed. Build-time config merge only - verified prisma generate
  # works under the major bump.
  "deepmerge-ts@<8.0.0": ">=8.0.0"

# pnpm 11 build-script allowlist. MAPPING form on purpose: written as a list,
# pnpm rewrites the file with garbage keys (arda, observed).
allowBuilds:
  "@prisma/engines": true
  "@prisma/client": true
  prisma: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@vxture/design-system@6.1.0 || 6.5.1 || 8.0.0 || 9.0.0 || 9.0.4'
  - '@vxture/design-ui@3.2.1 || 5.0.0 || 6.0.0 || 6.0.4'
